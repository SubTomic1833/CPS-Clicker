<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Simple CPS Test</title>
        <style>
            body{
                font-family:'Segoe UI', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background-color: #333;
                display:flex;
                flex-direction:column;
                align-items:center;
                justify-content:center;
                height:100vh;
                margin:0;
            }
            .game-container{
                background-color: white;
                padding:35px;
                border-radius:12px;
                box-shadow:0 4px 15px rgba(255,255,255,1);
                text-align:center;
                width:350px;
            }
            h1{
                color:#333;
                margin-bottom:5px;
            }
            .stats{
                display:flex;
                justify-content: space-around;
                margin:20px 0;
                font-size:1.1rem;
                font-weight:bold;
                color:#20232b;
            }
            #click-zone{
                background-color:#007bff;
                color:white;
                border:none;
                border-radius:7px;
                width:100%;
                padding:50px 0;
                font-size:1.5rem;
                font-weight:bold;
                cursor:pointer;
                transition:background-color 0.1s, transform 0.05s;
                user-select:none;
            }
            #click-zone:hover{
                background-color: #0056b3;
            }
            #click-zone:active{
                transform:scale(0.98);
            }
            #click-zone:disabled{
                background-color:#6c757d;
                cursor:not-allowed;
                transform: none;
            }
            #reset-btn{
                margin-top:20px;
                background-color:#28a745;
                color:white;
                border:none;
                padding:10px 20px;
                font-size:1rem;
                border-radius:5px;
                cursor:pointer;
            }
            #reset-btn:hover{
                background-color:#218838
            }
            .time-btn{
                background-color:#444;
                color:white;
                border:none;
                padding:8px 12px;
                margin:3px;
                border-radius:5px;
                cursor:pointer;
            }
            .time-btn:hover{
                background-color: #4b88c0;
            }
            .dashboard{
                margin-top:5px;
                padding:10px;
                background:#ffffff;
                border-radius:10px;
                color:#333;
                font-weight:bold;
            }
            .dashboard h3{
                margin:0 0 10px 0;
            }
        </style>
    </head>
    <body>
        <div class="game-container">
            <h1>CPS Test</h1>
            <p>Click the box below as fast as you can using left-click!</p>
            <div class="stats">
                <div>Time Left: <span id="timer-label">5.00</span></div>
                <div>Clicks: <span id="click-label">0</span></div>
            </div>
            <div style="font-size:1.2rem;font-weight:bold;color:#000000;margin-bottom:20px">
                Live CPS: <span id="cps-label">0.00</span> 
            </div>
            <div style="font-size:1rem;font-weight:bold;color:#8a8888;margin-bottom:20px">
                Best CPS: <span id="best-cps-label">0.00</span>
            </div>
            <div class="dashboard">
                <h3>Stats</h3>
                <div> Games Played: <span id="games-label">0</span></div>
                <div>Total Clicks: <span id="total-clicks-label">0</span></div>
                <div>Average CPS: <span id="avg-cps-label">0.00</span></div>
            </div>
            <div style="margin-bottom:20px;">
                <button class="time-btn" onclick="setTime(5)">5 Seconds</button>
                <button class="time-btn" onclick="setTime(10)">10 Seconds</button>
                <button class="time-btn" onclick="setTime(15)">15 Seconds</button>
            </div>
            <button id="click-zone">Click here to start!</button>
            <button id="reset-btn" style="display:none;">Play Again</button>
        </div>
        <script>
            const cZone=document.getElementById('click-zone');
            const tLabel=document.getElementById('timer-label');
            const cLabel=document.getElementById('click-label');
            const rBtn=document.getElementById('reset-btn');
            const cpsLabel=document.getElementById('cps-label');
            const bestCPSLabel=document.getElementById('best-cps-label');
            const gamesLabel=document.getElementById('games-label');
            const totalClicksLabel=document.getElementById('total-clicks-label');
            const avgCPSLabel=document.getElementById('avg-cps-label');

            let cCount=0;
            let tLeft=5;
            let gActive=false;
            let cdInt;
            let startTime;
            let gameLength=5;
            let bestCPS=localStorage.getItem("bestCPS") || 0;
            let gamesPlayed=Number(localStorage.getItem("gamesPlayed")) || 0;
            let totalClicks=Number(localStorage.getItem("totalClicks")) || 0;
            let totalCPS=Number(localStorage.getItem("totalCP")) || 0;
            bestCPSLabel.textContent=Number(bestCPS).toFixed(2);
            gamesLabel.textContent=gamesPlayed;
            totalClicksLabel.textContent=totalClicks;

            let averageCPS=gamesPlayed > 0 ? totalCPS/gamesPlayed : 0;
            avgCPSLabel.textContent=averageCPS.toFixed(2);
            function setTime(seconds){
                if(!gActive){
                    gameLength=seconds;
                    tLeft=gameLength;
                    tLabel.textContent=gameLength.toFixed(2);
                }
            }
            cZone.addEventListener('click',function(){
                if(!gActive && cCount===0){
                    startGame();
                }
                if(gActive){
                    cCount++;
                    cLabel.textContent=cCount;
                    let elapsed=(Date.now()-startTime)/1000;
                    let liveCPS=(cCount/elapsed).toFixed(2);
                    cpsLabel.textContent=liveCPS;
                }
            });
            function startGame(){
                if(!gActive){
                    gActive=true;
                    startTime=Date.now();
                    cZone.textContent="CLICK CLICK CLICK";
                    cdInt=setInterval(function(){
                        let elapsed=(Date.now()-startTime)/1000;
                        tLeft=Math.max(0,gameLength-elapsed);
                        tLabel.textContent=tLeft.toFixed(2);
                        if(tLeft<=0){
                            endGame();
                        }
                    },16);
                }    
            }
            function endGame(){
                gActive=false;
                clearInterval(cdInt);
                cZone.disabled=true;
                let elapsed=(Date.now()-startTime)/1000;
                elapsed=Math.min(elapsed,gameLength);
                let cps=(cCount/elapsed).toFixed(2);
                if(Number(cps)>Number(bestCPS)){
                    bestCPS=cps;
                    localStorage.setItem("bestCPS",bestCPS);
                    bestCPSLabel.textContent=Number(bestCPS).toFixed(2);
                }
                cpsLabel.textContent=cps;
                gamesPlayed++;
                totalClicks += cCount;
                totalCPS += Number(cps);
                localStorage.setItem("gamesPlayed",gamesPlayed);
                localStorage.setItem("totalClicks",totalClicks);
                localStorage.setItem("totalCPS",totalCPS);
                gamesLabel.textContent=gamesPlayed;
                totalClicksLabel.textContent=totalClicks;
                avgCPSLabel.textContent=(totalCPS/gamesPlayed).toFixed(2);
                cZone.textContent=`Finished! CPS: ${cps}`;
                rBtn.style.display="inline-block";
            }
            rBtn.addEventListener('click',function(){
                cCount=0;
                tLeft=gameLength;
                gActive=false;
                cLabel.textContent="0";
                cpsLabel.textContent="0.00";
                tLabel.textContent=gameLength.toFixed(2);
                cZone.textContent="Click here to start!";
                cZone.disabled=false;
                rBtn.style.display="none";
            });

        </script>
    </body>
</html>
